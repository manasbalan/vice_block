name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android APK
        run: |
          # 1. Create clean package.json & capacitor configuration
          cat << 'EOF' > package.json
          {
            "name": "vice-blocks",
            "version": "1.0.0",
            "private": true
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.viceblocks.game",
            "appName": "Vice Blocks",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF

          # 2. Populate www web assets
          mkdir -p www
          if [ -d "vice-block-gta" ]; then
            cp -r vice-block-gta/* www/
          elif [ -f "index.html" ]; then
            cp -r * www/ || true
          fi

          # Ensure required web assets exist
          [ ! -f "www/index.html" ] && curl -sL https://polite-stardust-bdc2e1.netlify.app/index.html -o www/index.html
          [ ! -f "www/three.min.js" ] && curl -sL https://polite-stardust-bdc2e1.netlify.app/three.min.js -o www/three.min.js
          [ ! -f "www/manifest.json" ] && curl -sL https://polite-stardust-bdc2e1.netlify.app/manifest.json -o www/manifest.json
          [ ! -f "www/icon-192.png" ] && curl -sL https://polite-stardust-bdc2e1.netlify.app/icon-192.png -o www/icon-192.png

          # 3. Install Capacitor, Add Platform & Sync Assets
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

          # 4. Fix Kotlin stdlib duplicate classes in Android Gradle
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

          # 5. Compile the native APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Download
        uses: actions/upload-artifact@v4
        with:
          name: ViceBlocks-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
